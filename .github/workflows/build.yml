name: iForge Build

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository (owner/repo)"
        required: true
        type: string
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string
      configuration:
        description: "Xcode build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      clean_build:
        description: "Clean DerivedData and previous build artifacts"
        required: true
        default: false
        type: boolean
      allow_package_plugins:
        description: "Explicitly allow Swift Package build-tool plugins by skipping Xcode plugin validation"
        required: true
        default: false
        type: boolean
      project_path:
        description: "Optional path containing the main Xcode project (for example src/ios)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout iForge Engine
        uses: actions/checkout@v5

      - name: Clone Repository
        env:
          REPOSITORY: ${{ inputs.repository }}
          BRANCH: ${{ inputs.branch }}
        run: |
          git -c protocol.file.allow=never clone --branch "$BRANCH" --depth 1 "https://github.com/$REPOSITORY.git" project

      - name: Prepare Project Configuration
        run: |
          if [ -f "project/src/ios/Configs/ProviderCustomization.xcconfig.example" ] && [ ! -f "project/src/ios/Configs/ProviderCustomization.xcconfig" ]; then
            cp "project/src/ios/Configs/ProviderCustomization.xcconfig.example" "project/src/ios/Configs/ProviderCustomization.xcconfig"
            echo "Created missing project configuration from its example template."
          fi

      - name: Prepare Source
        run: |
          chmod +x scripts/prepare_sources.sh
          ./scripts/prepare_sources.sh

      - name: Prepare Native Dependencies
        working-directory: project
        run: |
          set -euo pipefail
          if [ ! -f deps/build_ish.sh ] || [ ! -f deps/prepare_alpine_rootfs.sh ]; then
            echo "No iForge native dependency build scripts detected; skipping."
            exit 0
          fi
          brew install ninja llvm libarchive pkg-config meson || true
          chmod +x deps/build_lame.sh deps/build_ffmpeg.sh deps/build_ish.sh deps/prepare_alpine_rootfs.sh
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh

      - name: Analyze Project
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          CLEAN_BUILD: ${{ inputs.clean_build }}
          FORGE_ALLOW_PACKAGE_PLUGINS: ${{ inputs.allow_package_plugins }}
          FORGE_PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          chmod +x scripts/analyze.sh
          ./scripts/analyze.sh

      - name: Prepare Environment
        run: |
          chmod +x scripts/prepare.sh
          ./scripts/prepare.sh

      - name: Build iOS Scheme
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Export IPA
        run: |
          chmod +x scripts/export.sh
          ./scripts/export.sh

      - name: Detect IPA
        id: ipa
        run: |
          IPA_PATH=$(find project/build/export -maxdepth 1 -type f -name "*.ipa" -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA was generated."
            exit 1
          fi
          IPA_NAME=$(basename "$IPA_PATH")
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "IPA: $IPA_NAME"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: iForge-build-logs
          path: |
            project/build/logs/
            project/build/forge.env
          if-no-files-found: warn
          retention-days: 14
