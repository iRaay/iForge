name: iOS Builder

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository (owner/repo)"
        required: true
        default: "iRaay/Navi"

jobs:
  analyze:
    runs-on: macos-latest

    steps:
      - name: Clone Repository
  env:
    REPOSITORY: ${{ github.event.inputs.repository }}
  run: |
    git clone "https://github.com/$REPOSITORY.git" project

- name: Analyze Xcode Project
  run: |
    cd project

    PROJECT=$(find . -name "*.xcodeproj" | head -n 1)

    echo "Project:"
    echo "$PROJECT"

    xcodebuild -list -project "$PROJECT"
    
