name: iOS Builder

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository (owner/repo)"
        required: true
        default: "iRaay/Navi"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout iOS Builder
        uses: actions/checkout@v4

      - name: Clone Repository
        env:
          REPOSITORY: ${{ github.event.inputs.repository }}
        run: |
          git clone "https://github.com/$REPOSITORY.git" project

      - name: Install mise
        run: |
          brew install mise
          mise --version

      - name: Analyze Project
        run: |
          chmod +x scripts/analyze.sh
          ./scripts/analyze.sh

      - name: Prepare Environment
        run: |
          chmod +x scripts/prepare.sh
          ./scripts/prepare.sh

      - name: Build iOS Scheme
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

            - name: Export IPA
        run: |
          chmod +x scripts/export.sh
          ./scripts/export.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            project/build/Build/Products/**/*.app
            project/build/**/*.xcarchive
            project/build/**/*.ipa
