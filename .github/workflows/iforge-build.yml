name: iForge Build

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
      configuration:
        description: "Xcode build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
      clean_build:
        description: "Clean DerivedData and previous build artifacts"
        required: true
        default: true
        type: boolean
      allow_package_plugins:
        description: "Explicitly allow Swift Package build-tool plugins by skipping Xcode plugin validation"
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          path: project

      - name: Fetch iForge Engine
        run: git clone --depth 1 https://github.com/iRaay/iForge.git engine

      - name: Prepare Source
        run: |
          chmod +x engine/scripts/*.sh
          engine/scripts/prepare_sources.sh

      - name: Analyze Project
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          CLEAN_BUILD: ${{ inputs.clean_build }}
          FORGE_ALLOW_PACKAGE_PLUGINS: ${{ inputs.allow_package_plugins }}
        run: engine/scripts/analyze.sh

      - name: Prepare Environment
        run: engine/scripts/prepare.sh

      - name: Build iOS Scheme
        run: engine/scripts/build.sh

      - name: Export IPA
        run: engine/scripts/export.sh

      - name: Detect IPA
        id: ipa
        run: |
          IPA_PATH=$(find project/build/export -maxdepth 1 -type f -name "*.ipa" -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA was generated."
            exit 1
          fi
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$IPA_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: iForge-build-logs
          path: |
            project/build/logs/
            project/build/forge.env
          if-no-files-found: warn
          retention-days: 14