name: Apply v0.2 Enhancements
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout future branch
        uses: actions/checkout@v4
        with:
          ref: future
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply all v0.2 enhancements
        run: |
          python3 << 'PYEOF'
          import os
          import stat

          # ============================================================
          # 1. scripts/analyze.sh (Enhanced with Smart Scheme Selection)
          # ============================================================
          analyze_sh = r"""#!/bin/bash
set -e

echo "======================================"
echo "⚒ Forge — iOS Project Analyzer"
echo "======================================"

cd project

echo ""
echo "📁 Project Directory:"
pwd

mkdir -p build

# --------------------------------------------------
# 1. Detect Real Workspace
# --------------------------------------------------

WORKSPACE=$(find . \
  -type d \
  -name "*.xcodeproj" -prune -o \
  -type d -name "*.xcworkspace" -print \
  | head -n 1)

# --------------------------------------------------
# 2. Detect Xcode Project
# --------------------------------------------------

PROJECT=$(find . \
  -type d \
  -name "*.xcodeproj" -print \
  | head -n 1)

echo ""
echo "======================================"
echo "🔍 Project Detection"
echo "======================================"

if [ -n "$WORKSPACE" ]; then

  BUILD_TYPE="workspace"
  BUILD_FILE="$WORKSPACE"

  echo "✅ Workspace detected:"
  echo "$WORKSPACE"

elif [ -n "$PROJECT" ]; then

  BUILD_TYPE="project"
  BUILD_FILE="$PROJECT"

  echo "✅ Xcode Project detected:"
  echo "$PROJECT"

else

  echo "❌ No .xcworkspace or .xcodeproj found."
  exit 1

fi

# --------------------------------------------------
# 3. Detect Schemes
# --------------------------------------------------

echo ""
echo "======================================"
echo "🎯 Scheme Detection"
echo "======================================"

if [ "$BUILD_TYPE" = "workspace" ]; then

  LIST_OUTPUT=$(xcodebuild -list -workspace "$BUILD_FILE")

else

  LIST_OUTPUT=$(xcodebuild -list -project "$BUILD_FILE")

fi

echo "$LIST_OUTPUT"

echo ""
echo "--------------------------------------"
echo "📱 Available Schemes"
echo "--------------------------------------"

SCHEMES=$(echo "$LIST_OUTPUT" |
  sed -n '/Schemes:/,$p' |
  tail -n +2 |
  sed '/^[[:space:]]*$/d' |
  sed 's/^[[:space:]]*//')

if [ -z "$SCHEMES" ]; then
  echo "❌ No schemes found."
  exit 1
fi

echo "$SCHEMES"

# --------------------------------------------------
# 4. Smart Scheme Selection
# --------------------------------------------------

echo ""
echo "======================================"
echo "🧠 Smart Scheme Selection"
echo "======================================"

PROJECT_BASENAME=$(basename "$BUILD_FILE" .xcodeproj)
PROJECT_BASENAME=${PROJECT_BASENAME%.xcworkspace}

echo "Project basename: $PROJECT_BASENAME"
echo ""

BEST_SCHEME=""
BEST_SCORE=-999

while IFS= read -r scheme; do
  [ -z "$scheme" ] && continue
  scheme=$(echo "$scheme" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
  [ -z "$scheme" ] && continue
  SCORE=0
  if echo "$scheme" | grep -qiE "(test|tests|uitest|watch|widget|extension|intents|clip)"; then
    SCORE=$((SCORE - 100))
  fi
  if [ "$scheme" = "$PROJECT_BASENAME" ]; then
    SCORE=$((SCORE + 50))
  fi
  if ! echo "$scheme" | grep -qiE "(test|watch|widget|extension|intents|clip)"; then
    SCORE=$((SCORE + 30))
  fi
  if echo "$scheme" | grep -qi "App" && ! echo "$scheme" | grep -qi "Clip"; then
    SCORE=$((SCORE + 20))
  fi
  LEN=${#scheme}
  if [ "$LEN" -le 15 ]; then
    SCORE=$((SCORE + 10))
  fi
  echo "  → $scheme (score: $SCORE)"
  if [ "$SCORE" -gt "$BEST_SCORE" ]; then
    BEST_SCORE=$SCORE
    BEST_SCHEME="$scheme"
  fi
done <<< "$SCHEMES"

if [ "$BEST_SCORE" -lt 0 ]; then
  FALLBACK=$(echo "$SCHEMES" | head -n 1)
  FALLBACK=$(echo "$FALLBACK" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
  echo ""
  echo "⚠️  All schemes appear secondary. Falling back to first: $FALLBACK"
  BEST_SCHEME="$FALLBACK"
  BEST_SCORE=0
fi

SCHEME="$BEST_SCHEME"

echo ""
echo "======================================"
echo "🎯 Selected Scheme"
echo "======================================"
echo "$SCHEME"

# --------------------------------------------------
# 4.5 Validate Platform (iOS)
# --------------------------------------------------

echo ""
echo "======================================"
echo "📱 Platform Validation"
echo "======================================"

BUILD_SETTINGS=$(xcodebuild -$BUILD_TYPE "$BUILD_FILE" -scheme "$SCHEME" -showBuildSettings 2>/dev/null || true)
SUPPORTED_PLATFORMS=$(echo "$BUILD_SETTINGS" | grep "SUPPORTED_PLATFORMS" | head -n 1 | sed 's/.*= //' | tr -d ' ' || true)

if [ -n "$SUPPORTED_PLATFORMS" ]; then
  if echo "$SUPPORTED_PLATFORMS" | grep -qE "iphoneos|iphonesimulator"; then
    echo "✅ Valid iOS platform: $SUPPORTED_PLATFORMS"
  else
    echo "⚠️  Warning: Scheme may not target iOS. SUPPORTED_PLATFORMS: $SUPPORTED_PLATFORMS"
    echo "   Continuing anyway..."
  fi
else
  echo "ℹ️  Could not validate platform (xcodebuild may not be available in test environment)"
fi

# --------------------------------------------------
# 5. Detect Build Requirements
# --------------------------------------------------

echo ""
echo "======================================"
echo "🧠 Requirements Detection"
echo "======================================"

FORGE_USE_SPM="false"
FORGE_USE_COCOAPODS="false"
FORGE_USE_CARTHAGE="false"
FORGE_USE_MISE="false"

if find . \
  -type f \
  \( -name "Package.swift" -o -name "Package.resolved" \) \
  -not -path "./.git/*" \
  -not -path "./build/*" \
  | grep -q .; then
  FORGE_USE_SPM="true"
elif find . \
  -type f \
  -name "project.pbxproj" \
  -not -path "./.git/*" \
  -not -path "./build/*" \
  -exec grep -l \
  -e "XCRemoteSwiftPackageReference" \
  -e "XCLocalSwiftPackageReference" \
  {} + \
  | grep -q .; then
  FORGE_USE_SPM="true"
fi

if find . \
  -type f \
  -name "Podfile" \
  -not -path "./.git/*" \
  -not -path "./build/*" \
  | grep -q .; then
  FORGE_USE_COCOAPODS="true"
fi

if find . \
  -type f \
  -name "Cartfile" \
  -not -path "./.git/*" \
  -not -path "./build/*" \
  | grep -q .; then
  FORGE_USE_CARTHAGE="true"
fi

if find . \
  -type f \
  \( \
  -name ".mise.toml" \
  -o -name "mise.toml" \
  -o -name ".mise.local.toml" \
  -o -name "mise.local.toml" \
  \) \
  -not -path "./.git/*" \
  -not -path "./build/*" \
  | grep -q .; then
  FORGE_USE_MISE="true"
fi

echo ""
echo "--------------------------------------"
echo "📋 Detected Requirements"
echo "--------------------------------------"

echo "Swift Package Manager:"
if [ "$FORGE_USE_SPM" = "true" ]; then echo "✅ Required"; else echo "❌ Not detected"; fi

echo ""
echo "CocoaPods:"
if [ "$FORGE_USE_COCOAPODS" = "true" ]; then echo "✅ Required"; else echo "❌ Not detected"; fi

echo ""
echo "Carthage:"
if [ "$FORGE_USE_CARTHAGE" = "true" ]; then echo "✅ Required"; else echo "❌ Not detected"; fi

echo ""
echo "mise:"
if [ "$FORGE_USE_MISE" = "true" ]; then echo "✅ Required"; else echo "❌ Not detected"; fi

# --------------------------------------------------
# 6. Save Forge Configuration
# --------------------------------------------------

CONFIG_FILE="build/forge.env"

cat > "$CONFIG_FILE" <<EOF
FORGE_BUILD_TYPE=$BUILD_TYPE
FORGE_BUILD_FILE=$BUILD_FILE
FORGE_SCHEME=$SCHEME
FORGE_USE_SPM=$FORGE_USE_SPM
FORGE_USE_COCOAPODS=$FORGE_USE_COCOAPODS
FORGE_USE_CARTHAGE=$FORGE_USE_CARTHAGE
FORGE_USE_MISE=$FORGE_USE_MISE
EOF

echo ""
echo "======================================"
echo "💾 Forge Configuration Saved"
echo "======================================"
echo "File: $CONFIG_FILE"
echo ""
cat "$CONFIG_FILE"

echo ""
echo "======================================"
echo "✅ Analysis Complete"
echo "======================================"
"""

          # ============================================================
          # 2. scripts/build.sh
          # ============================================================
          build_sh = r"""#!/bin/bash
set -e

echo "======================================"
echo "⚒ iForge — Build"
echo "======================================"

cd project

CONFIG_FILE="build/forge.env"

if [ ! -f "$CONFIG_FILE" ]; then
  echo "❌ iForge configuration not found."
  exit 1
fi

source "$CONFIG_FILE"

if [ -z "$FORGE_BUILD_TYPE" ]; then
  echo "❌ FORGE_BUILD_TYPE is missing."
  exit 1
fi

if [ -z "$FORGE_BUILD_FILE" ]; then
  echo "❌ FORGE_BUILD_FILE is missing."
  exit 1
fi

if [ -z "$FORGE_SCHEME" ]; then
  echo "❌ FORGE_SCHEME is missing."
  exit 1
fi

BUILD_CONFIGURATION="${IFORGE_BUILD_CONFIGURATION:-Release}"

echo ""
echo "======================================"
echo "📋 iForge Configuration"
echo "======================================"
echo "Build Type:"
echo "$FORGE_BUILD_TYPE"
echo ""
echo "Build File:"
echo "$FORGE_BUILD_FILE"
echo ""
echo "Scheme:"
echo "$FORGE_SCHEME"
echo ""
echo "Configuration:"
echo "$BUILD_CONFIGURATION"

mkdir -p build
ARCHIVE_PATH="build/Forge.xcarchive"

echo ""
echo "======================================"
echo "📦 Archive"
echo "======================================"
echo "Archive Path:"
echo "$ARCHIVE_PATH"

if [ "$FORGE_BUILD_TYPE" = "workspace" ]; then
  BUILD_ARGUMENT=(-workspace "$FORGE_BUILD_FILE")
elif [ "$FORGE_BUILD_TYPE" = "project" ]; then
  BUILD_ARGUMENT=(-project "$FORGE_BUILD_FILE")
else
  echo "❌ Unknown build type: $FORGE_BUILD_TYPE"
  exit 1
fi

export IFORGE_BUILD_START=$(date +%s)

xcodebuild \
"${BUILD_ARGUMENT[@]}" \
-scheme "$FORGE_SCHEME" \
-configuration "$BUILD_CONFIGURATION" \
-destination "generic/platform=iOS" \
-derivedDataPath build \
-archivePath "$ARCHIVE_PATH" \
CODE_SIGNING_ALLOWED=NO \
ENABLE_PREVIEWS=NO \
archive

echo ""
echo "======================================"
echo "✅ iForge Archive Finished"
echo "======================================"
echo ""
echo "Archive:"
echo "$ARCHIVE_PATH"
"""

          # ============================================================
          # 3. scripts/export.sh
          # ============================================================
          export_sh = r"""#!/bin/bash
set -e

echo "======================================"
echo "⚒ iForge — Export IPA"
echo "======================================"

cd project

CONFIG_FILE="build/forge.env"
if [ ! -f "$CONFIG_FILE" ]; then
  echo "❌ iForge configuration not found: $CONFIG_FILE"
  exit 1
fi
source "$CONFIG_FILE"

ARCHIVE_PATH="build/Forge.xcarchive"
EXPORT_PATH="build/export"
STAGING_PATH="build/ipa-staging"

if [ ! -d "$ARCHIVE_PATH" ]; then
  echo "❌ Archive not found: $ARCHIVE_PATH"
  exit 1
fi

echo ""
echo "🔍 Finding Application"

APP_PATH=$(find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name "*.app" -print -quit)
if [ -z "$APP_PATH" ]; then
  echo "❌ No .app found inside archive."
  exit 1
fi

APP_NAME=$(basename "$APP_PATH" .app)

if [ "$APP_NAME" = "iForge" ]; then
  IPA_NAME="iForge-Build.ipa"
else
  IPA_NAME="${APP_NAME}.ipa"
fi

IPA_PATH="$EXPORT_PATH/$IPA_NAME"

echo "Application: $APP_NAME.app"
echo "IPA: $IPA_NAME"

echo ""
echo "📦 Preparing IPA"
rm -rf "$STAGING_PATH"
mkdir -p "$STAGING_PATH/Payload" "$EXPORT_PATH"
find "$ARCHIVE_PATH/Products/Applications" -maxdepth 1 -type d -name "*.app" -exec cp -R {} "$STAGING_PATH/Payload/" \;

cd "$STAGING_PATH"
zip -qry "../export/$IPA_NAME" Payload
cd ..

if [ ! -f "$IPA_PATH" ]; then
  echo "❌ IPA was not created: $IPA_PATH"
  exit 1
fi

echo ""
echo "Size:"
du -h "$IPA_PATH"
echo ""
echo "======================================"
echo "✅ IPA Ready"
echo "======================================"
echo "$IPA_PATH"
"""

          # ============================================================
          # 4. scripts/report.sh
          # ============================================================
          report_sh = r"""#!/bin/bash
set -e

echo "======================================"
echo "📊 iForge — Build Report"
echo "======================================"

REPORT_FILE="build-report.json"

REPORT_PROJECT="unknown"
REPORT_SCHEME="unknown"
REPORT_SCHEME_SCORE=0
REPORT_BUILD_TIME=0
REPORT_IPA_SIZE="0"
REPORT_STATUS="unknown"
REPORT_WARNINGS="[]"
REPORT_ERROR=""

if [ -f "project/build/forge.env" ]; then
  source "project/build/forge.env"
  REPORT_PROJECT=$(basename "$FORGE_BUILD_FILE" .xcodeproj)
  REPORT_PROJECT=${REPORT_PROJECT%.xcworkspace}
  REPORT_SCHEME="$FORGE_SCHEME"
fi

IPA_PATH=$(find project/build/export -maxdepth 1 -type f -name "*.ipa" -print -quit 2>/dev/null || true)
if [ -n "$IPA_PATH" ] && [ -f "$IPA_PATH" ]; then
  REPORT_IPA_SIZE=$(du -h "$IPA_PATH" | cut -f1)
  REPORT_STATUS="success"
else
  REPORT_STATUS="failed"
  REPORT_ERROR="No IPA generated"
fi

if [ -n "$IFORGE_BUILD_START" ]; then
  END_TIME=$(date +%s)
  REPORT_BUILD_TIME=$((END_TIME - IFORGE_BUILD_START))
fi

cat > "$REPORT_FILE" <<EOF
{
  "project": "$REPORT_PROJECT",
  "scheme": "$REPORT_SCHEME",
  "scheme_score": $REPORT_SCHEME_SCORE,
  "build_time_seconds": $REPORT_BUILD_TIME,
  "ipa_size": "$REPORT_IPA_SIZE",
  "status": "$REPORT_STATUS",
  "warnings": $REPORT_WARNINGS,
  "error": "$REPORT_ERROR",
  "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
  "version": "0.2.0"
}
EOF

echo ""
echo "📄 Report saved to: $REPORT_FILE"
cat "$REPORT_FILE"
echo ""
echo "======================================"
echo "✅ Report Generated"
echo "======================================"
"""

          # ============================================================
          # 5. .github/workflows/lint.yml
          # ============================================================
          lint_yml = """name: Lint
on:
  push:
    branches: [main, future]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, future]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning
          format: tty
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC1090
      - name: Check for executable permissions
        run: |
          echo "🔍 Checking script permissions..."
          for script in scripts/*.sh; do
            if [ ! -x "$script" ]; then
              echo "❌ $script is not executable"
              exit 1
            else
              echo "✅ $script is executable"
            fi
          done
"""

          # ============================================================
          # 6. .github/workflows/test-iforge.yml
          # ============================================================
          test_yml = """name: Test iForge
on:
  push:
    branches: [main, future]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-iforge.yml'
  pull_request:
    branches: [main, future]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/test-iforge.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    name: Unit Tests (Bats)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bats
        run: |
          git clone https://github.com/bats-core/bats-core.git /tmp/bats
          cd /tmp/bats
          sudo ./install.sh /usr/local
          bats --version
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version
      - name: Run Bats Tests
        run: |
          cd tests
          chmod +x run-tests.sh
          ./run-tests.sh
  integration-test:
    name: Integration Test (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test on SimpleApp Fixture
        run: |
          echo "🔧 Setting up test environment..."
          mkdir -p project
          cp -R tests/fixtures/SimpleApp/* project/
          echo "📊 Running analyze..."
          chmod +x scripts/analyze.sh
          cd project && ../scripts/analyze.sh && cd ..
          echo "✅ Analyze completed"
          cat project/build/forge.env
      - name: Generate Build Report
        if: always()
        run: |
          chmod +x scripts/report.sh
          ./scripts/report.sh || true
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build-report.json
          if-no-files-found: ignore
"""

          # ============================================================
          # 7. .github/workflows/build.yml
          # ============================================================
          build_yml = """name: iForge Build
on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository (owner/repo)"
        required: true
        type: string
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout iForge
        uses: actions/checkout@v4
      - name: Clone Repository
        env:
          REPOSITORY: ${{ github.event.inputs.repository }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          git clone --branch "$BRANCH" "https://github.com/$REPOSITORY.git" project
      - name: Analyze Project
        run: |
          chmod +x scripts/analyze.sh
          ./scripts/analyze.sh
      - name: Prepare Environment
        run: |
          chmod +x scripts/prepare.sh
          ./scripts/prepare.sh
      - name: Build iOS Scheme
        env:
          IFORGE_BUILD_CONFIGURATION: ${{ github.event.inputs.configuration }}
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
      - name: Export IPA
        run: |
          chmod +x scripts/export.sh
          ./scripts/export.sh
      - name: Generate Build Report
        if: always()
        run: |
          chmod +x scripts/report.sh
          ./scripts/report.sh || true
      - name: Detect IPA
        id: ipa
        run: |
          IPA_PATH=$(find project/build/export -maxdepth 1 -type f -name "*.ipa" -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ No IPA was generated."
            exit 1
          fi
          IPA_NAME=$(basename "$IPA_PATH")
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "IPA: $IPA_NAME"
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ipa.outputs.name }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload Build Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.json
          if-no-files-found: ignore
"""

          # ============================================================
          # 8. .github/copilot-instructions.md
          # ============================================================
          copilot_md = """# iForge — AI Assistant Instructions
## Project Overview
iForge is an open-source automation engine that builds iOS projects from GitHub repositories into unsigned IPAs. It runs on GitHub Actions (macOS runners).
## Core Philosophy
- **Build** ≠ **Sign**: iForge builds only. Signing is external.
- **Zero-config**: Automatic detection of project structure, schemes, and dependencies.
- **Pipeline**: Analyze → Prepare → Build → Export
## Architecture
### Directory Structure
```
scripts/
  analyze.sh    — Detects .xcodeproj/.xcworkspace, schemes, dependencies
  prepare.sh    — Installs tools (mise, CocoaPods, Carthage), resolves dependencies
  build.sh      — Runs xcodebuild archive with CODE_SIGNING_ALLOWED=NO
  export.sh     — Creates unsigned IPA from .xcarchive
  report.sh     — Generates JSON build report
  sign.sh       — (Placeholder) Future signing plugin
```
### Configuration File
`build/forge.env` is generated by `analyze.sh` and consumed by all other scripts.
Variables:
- `FORGE_BUILD_TYPE` — "workspace" or "project"
- `FORGE_BUILD_FILE` — Path to .xcworkspace or .xcodeproj
- `FORGE_SCHEME` — Selected build scheme (smart selection)
- `FORGE_USE_SPM` — "true" or "false"
- `FORGE_USE_COCOAPODS` — "true" or "false"
- `FORGE_USE_CARTHAGE` — "true" or "false"
- `FORGE_USE_MISE` — "true" or "false"
### GitHub Actions Workflows
- `build.yml` — Main workflow: clones user repo, runs full pipeline
- `forge-ios-app.yml` — Builds the iForge app itself
- `lint.yml` — ShellCheck on all scripts
- `test-iforge.yml` — Bats unit tests + integration tests
## Coding Standards
- All scripts must start with `#!/bin/bash` and `set -e`
- All scripts must be executable (`chmod +x`)
- Use `echo ""` for blank lines, not `echo`
- Use descriptive section headers: `echo "==== ... ===="`
- Always check file existence before reading: `if [ ! -f "$FILE" ]; then ... fi`
- Quote all variables: `"$VAR"` not `$VAR`
- Use `shellcheck` to validate before committing
## Testing
- Unit tests: `tests/bats/*.bats` (Bats framework)
- Fixtures: `tests/fixtures/` contains sample iOS projects
- Run tests: `cd tests && ./run-tests.sh`
## Smart Scheme Selection (v0.2+)
When modifying scheme selection logic:
1. Prefer schemes matching project basename
2. Penalize schemes containing: Test, Tests, UITest, Watch, Widget, Extension, Intents, Clip
3. Validate that selected scheme builds for iOS platform
4. Always provide fallback to first scheme
5. Score system: exact match (+50), no secondary keywords (+30), contains App (+20), short name (+10)
## Dependencies
- macOS runner with Xcode
- `xcodebuild` command-line tools
- `brew` for tool installation (CocoaPods, Carthage, mise)
- GitHub Actions `actions/upload-artifact@v4` for IPA upload
"""

          # ============================================================
          # 9. tests/bats/helper.bash
          # ============================================================
          helper_bash = r"""#!/bin/bash
setup() {
    TEST_TEMP_DIR=$(mktemp -d)
    export TEST_TEMP_DIR
    SCRIPTS_DIR="$BATS_TEST_DIRNAME/../../scripts"
    export SCRIPTS_DIR
    FIXTURES_DIR="$BATS_TEST_DIRNAME/../fixtures"
    export FIXTURES_DIR
}
teardown() {
    if [ -n "$TEST_TEMP_DIR" ] && [ -d "$TEST_TEMP_DIR" ]; then
        rm -rf "$TEST_TEMP_DIR"
    fi
}
create_fake_xcodeproj() {
    local dir="$1"
    local name="$2"
    mkdir -p "$dir/$name.xcodeproj"
    touch "$dir/$name.xcodeproj/project.pbxproj"
}
create_fake_workspace() {
    local dir="$1"
    local name="$2"
    mkdir -p "$dir/$name.xcworkspace"
    touch "$dir/$name.xcworkspace/contents.xcworkspacedata"
}
assert_file_exists() {
    if [ ! -f "$1" ]; then
        echo "❌ Expected file to exist: $1"
        return 1
    fi
}
"""

          # ============================================================
          # 10. tests/bats/analyze.bats
          # ============================================================
          analyze_bats = r"""#!/usr/bin/env bats
load 'helper'
