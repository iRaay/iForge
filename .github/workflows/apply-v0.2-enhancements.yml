name: Apply v0.2 Enhancements
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout future branch
        uses: actions/checkout@v4
        with:
          ref: future
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create directories
        run: |
          mkdir -p scripts
          mkdir -p .github/workflows
          mkdir -p tests/bats
          mkdir -p tests/fixtures/SimpleApp/SimpleApp.xcodeproj
          mkdir -p tests/fixtures/WorkspaceApp/WorkspaceApp.xcodeproj
          mkdir -p tests/fixtures/WorkspaceApp/WorkspaceApp.xcworkspace
          mkdir -p tests/fixtures/CocoaPodsApp/CocoaPodsApp.xcodeproj
          mkdir -p tests/fixtures/SPMApp/SPMApp.xcodeproj
          mkdir -p tests/fixtures/MultiSchemeApp/MultiSchemeApp.xcodeproj
          mkdir -p docs

      - name: Write scripts/analyze.sh
        run: echo "" | base64 -d > scripts/analyze.sh

      - name: Write scripts/build.sh
        run: echo "" | base64 -d > scripts/build.sh

      - name: Write scripts/export.sh
        run: echo "" | base64 -d > scripts/export.sh

      - name: Write scripts/report.sh
        run: echo "" | base64 -d > scripts/report.sh

      - name: Write .github/workflows/lint.yml
        run: echo "" | base64 -d > .github/workflows/lint.yml

      - name: Write .github/workflows/test-iforge.yml
        run: echo "" | base64 -d > .github/workflows/test-iforge.yml

      - name: Write .github/workflows/build.yml
        run: echo "" | base64 -d > .github/workflows/build.yml

      - name: Write .github/copilot-instructions.md
        run: echo "" | base64 -d > .github/copilot-instructions.md

      - name: Write tests/bats/helper.bash
        run: echo "" | base64 -d > tests/bats/helper.bash

      - name: Write tests/bats/analyze.bats
        run: echo "" | base64 -d > tests/bats/analyze.bats

      - name: Write tests/bats/build.bats
        run: echo "" | base64 -d > tests/bats/build.bats

      - name: Write tests/run-tests.sh
        run: echo "" | base64 -d > tests/run-tests.sh

      - name: Write docs/testing.md
        run: echo "" | base64 -d > docs/testing.md

      - name: Write fixture files
        run: |
          echo "Ly8gISQqVVRGOCokIQp7CglhcmNoaXZlVmVyc2lvbiA9IDE7CgljbGFzc2VzID0gewoJfTsKCW9iamVjdFZlcnNpb24gPSA1NjsKCW9iamVjdHMgPSB7Cgl9OwoJcm9vdE9iamVjdCA9IDgzQ0JCOUY3MUE2MDFDQkEwMEU5QjE5MjsKfQo=" | base64 -d > tests/fixtures/SimpleApp/SimpleApp.xcodeproj/project.pbxproj
          echo "Ly8gISQqVVRGOCokIQp7CglhcmNoaXZlVmVyc2lvbiA9IDE7CgljbGFzc2VzID0gewoJfTsKCW9iamVjdFZlcnNpb24gPSA1NjsKCW9iamVjdHMgPSB7Cgl9OwoJcm9vdE9iamVjdCA9IDgzQ0JCOUY3MUE2MDFDQkEwMEU5QjE5MjsKfQo=" | base64 -d > tests/fixtures/WorkspaceApp/WorkspaceApp.xcodeproj/project.pbxproj
          echo "Ly8gISQqVVRGOCokIQp7CglhcmNoaXZlVmVyc2lvbiA9IDE7CgljbGFzc2VzID0gewoJfTsKCW9iamVjdFZlcnNpb24gPSA1NjsKCW9iamVjdHMgPSB7Cgl9OwoJcm9vdE9iamVjdCA9IDgzQ0JCOUY3MUE2MDFDQkEwMEU5QjE5MjsKfQo=" | base64 -d > tests/fixtures/CocoaPodsApp/CocoaPodsApp.xcodeproj/project.pbxproj
          echo "Ly8gISQqVVRGOCokIQp7CglhcmNoaXZlVmVyc2lvbiA9IDE7CgljbGFzc2VzID0gewoJfTsKCW9iamVjdFZlcnNpb24gPSA1NjsKCW9iamVjdHMgPSB7Cgl9OwoJcm9vdE9iamVjdCA9IDgzQ0JCOUY3MUE2MDFDQkEwMEU5QjE5MjsKfQo=" | base64 -d > tests/fixtures/SPMApp/SPMApp.xcodeproj/project.pbxproj
          echo "Ly8gISQqVVRGOCokIQp7CglhcmNoaXZlVmVyc2lvbiA9IDE7CgljbGFzc2VzID0gewoJfTsKCW9iamVjdFZlcnNpb24gPSA1NjsKCW9iamVjdHMgPSB7Cgl9OwoJcm9vdE9iamVjdCA9IDgzQ0JCOUY3MUE2MDFDQkEwMEU5QjE5MjsKfQo=" | base64 -d > tests/fixtures/MultiSchemeApp/MultiSchemeApp.xcodeproj/project.pbxproj
          echo '<?xml version="1.0" encoding="UTF-8"?><Workspace></Workspace>' > tests/fixtures/WorkspaceApp/WorkspaceApp.xcworkspace/contents.xcworkspacedata
          echo "platform :ios, '15.0'" > tests/fixtures/CocoaPodsApp/Podfile
          echo '// swift-tools-version:5.7' > tests/fixtures/SPMApp/Package.swift

      - name: Set executable permissions
        run: |
          chmod +x scripts/*.sh
          chmod +x tests/run-tests.sh

      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat(v0.2): smart scheme selection, testing infra, shellcheck, build reports

- Enhanced analyze.sh with Smart Scheme Selection algorithm
- Added platform validation (iOS detection)
- Added build configuration input (Debug/Release)
- Added scripts/report.sh for JSON build reports
- Added ShellCheck CI workflow (lint.yml)
- Added Bats unit tests + integration tests (test-iforge.yml)
- Added test fixtures (SimpleApp, WorkspaceApp, CocoaPodsApp, SPMApp, MultiSchemeApp)
- Added .github/copilot-instructions.md for AI context
- Added docs/testing.md
- Enhanced build.yml with configuration choice input
- Fixed export.sh to support App Extensions"
          git push origin future
