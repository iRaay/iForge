@test "smart scheme selection prefers main app over tests" {
    SCHEMES="MyApp
MyAppTests
MyAppUITests
MyAppWatch
MyAppWidgetExtension"
    PROJECT_BASENAME="MyApp"
    BEST_SCHEME=""
    BEST_SCORE=-999
    while IFS= read -r s; do
        [ -z "$s" ] && continue
        s=$(echo "$s" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
        [ -z "$s" ] && continue
        SCORE=0
        if echo "$s" | grep -qiE "(test|tests|uitest|watch|widget|extension|intents|clip)"; then
            SCORE=$((SCORE - 100))
        fi
        if [ "$s" = "$PROJECT_BASENAME" ]; then
            SCORE=$((SCORE + 50))
        fi
        if ! echo "$s" | grep -qiE "(test|watch|widget|extension|intents|clip)"; then
            SCORE=$((SCORE + 30))
        fi
        if echo "$s" | grep -qi "App" && ! echo "$s" | grep -qi "Clip"; then
            SCORE=$((SCORE + 20))
        fi
        LEN=${#s}
        if [ "$LEN" -le 15 ]; then
            SCORE=$((SCORE + 10))
        fi
        if [ "$SCORE" -gt "$BEST_SCORE" ]; then
            BEST_SCORE=$SCORE
            BEST_SCHEME="$s"
        fi
    done <<< "$SCHEMES"
    [ "$BEST_SCHEME" = "MyApp" ]
    [ "$BEST_SCORE" -eq 90 ]
}
