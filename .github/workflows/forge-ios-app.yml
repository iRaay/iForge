name: iForge Build

on:
  workflow_dispatch:

jobs:
  build-iforge-app:
    runs-on: macos-latest
    steps:
      - name: Checkout iForge
        uses: actions/checkout@v5

      - name: Build iForge archive
        run: |
          xcodebuild \
            -project ForgeApp/ForgeApp.xcodeproj \
            -scheme iForge \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/iForge.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create iForge IPA
        run: |
          set -e
          APP_PATH="build/iForge.xcarchive/Products/Applications/iForge.app"
          STAGING="build/ipa-staging"
          mkdir -p "$STAGING/Payload" build/export
          rm -rf "$STAGING/Payload/iForge.app"
          cp -R "$APP_PATH" "$STAGING/Payload/iForge.app"
          cd "$STAGING"
          zip -qry "../export/iForge-Build.ipa" Payload

      - name: Upload iForge IPA
        uses: actions/upload-artifact@v5
        with:
          name: iForge-Build-ipa
          path: build/export/iForge-Build.ipa
          if-no-files-found: error
          retention-days: 14
